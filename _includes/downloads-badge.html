<span class="dl-badge" tabindex="0" data-huggingface="{{ site.data.downloads.huggingface }}" data-kaggle="{{ site.data.downloads.kaggle }}" hidden>
  <svg class="dl-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"/><path fill="currentColor" d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.78a.749.749 0 1 1 1.06-1.06l1.97 1.969Z"/></svg>
  <span><span class="dl-count"></span> downloads</span>
  <span class="dl-tip"></span>
</span>
<script>
  (function () {
    var badge = document.querySelector('.dl-badge');
    function total(url, field) {
      return fetch(url)
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (list) { return list.reduce(function (sum, d) { return sum + (d[field] || 0); }, 0); });
    }
    Promise.all([
      total('https://huggingface.co/api/datasets?author=' + badge.dataset.huggingface + '&expand[]=downloadsAllTime', 'downloadsAllTime'),
      total('https://www.kaggle.com/api/v1/datasets/list?user=' + badge.dataset.kaggle, 'downloadCount')
    ])
      .then(function (counts) {
        var n = counts[0] + counts[1];
        badge.querySelector('.dl-count').textContent = n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n);
        badge.querySelector('.dl-tip').textContent = counts[0].toLocaleString('en-US') + ' on Hugging Face + ' + counts[1].toLocaleString('en-US') + ' on Kaggle';
        badge.hidden = false;
      })
      .catch(function () {});
  })();
</script>
