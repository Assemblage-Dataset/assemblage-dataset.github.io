<div class="repo-grid">
{%- for r in site.data.repos %}
  <div class="repo-card" data-repo="{{ r.name }}">
    <svg class="repo-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    <div class="repo-main">
      <div class="repo-name"><a href="{{ r.url }}">{{ r.name }}</a></div>
      <p class="repo-desc">{{ r.description }}</p>
      <div class="repo-meta">
        <span class="ds-tag">{{ r.language }}</span>
        <span class="ds-tag ds-tag--format">{{ r.license }} license</span>
        <span class="ds-tag ds-tag--format repo-stat" data-stat="stargazers_count" hidden>&#9733; <span></span> stars</span>
        <span class="ds-tag ds-tag--format repo-stat" data-stat="forks_count" hidden><span></span> forks</span>
        <span class="ds-tag ds-tag--format repo-stat" data-stat="open_issues_count" hidden><span></span> open issues</span>
      </div>
    </div>
    <div class="repo-actions">
      <a class="repo-btn repo-btn--primary" href="{{ r.url }}">View code</a>
      <a class="repo-btn" href="{{ r.issues_url }}">Report a bug</a>
    </div>
  </div>
{%- endfor %}
  <script>
    document.querySelectorAll('.repo-card[data-repo]').forEach(function (card) {
      fetch('https://api.github.com/repos/' + card.dataset.repo)
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (info) {
          card.querySelectorAll('.repo-stat').forEach(function (chip) {
            var n = info[chip.dataset.stat];
            if (typeof n !== 'number') return;
            chip.querySelector('span').textContent = n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n);
            chip.hidden = false;
          });
        })
        .catch(function () {});
    });
  </script>
</div>
